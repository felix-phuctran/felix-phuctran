      >
        <tspan x="25" dy="0">
          The silk slip dress is elegant and effortless,
        </tspan>
        <tspan x="25" dy="15">
          perfect for special moments and everyday style.
        </tspan>
        <tspan x="25" dy="15">
          Crafted from smooth premium silk.
        </tspan>
      </text>


      <!-- size -->
      <text
