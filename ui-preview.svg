<svg
  width="1408"
  height="768"
  viewBox="0 0 1408 768"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Background -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="45%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#090909"/>
    </radialGradient>

    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#8D7340" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#8D7340" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E9B7"/>
      <stop offset="45%" stop-color="#C6A45B"/>
      <stop offset="100%" stop-color="#8E6C31"/>
    </linearGradient>

    <linearGradient id="goldButton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C5A15A"/>
      <stop offset="100%" stop-color="#937039"/>
    </linearGradient>

    <!-- Phone body -->
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E3E3E"/>
      <stop offset="30%" stop-color="#090909"/>
      <stop offset="70%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="phoneEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#777777"/>
      <stop offset="30%" stop-color="#151515"/>
      <stop offset="70%" stop-color="#666666"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>

    <!-- Screen -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F3E7"/>
      <stop offset="100%" stop-color="#EDE4D1"/>
    </linearGradient>

    <!-- Product backgrounds -->
    <linearGradient id="product1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9CFC0"/>
      <stop offset="100%" stop-color="#B8AA97"/>
    </linearGradient>

    <linearGradient id="product2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E1D5C3"/>
      <stop offset="100%" stop-color="#C2B29C"/>
    </linearGradient>

    <linearGradient id="product3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A4741"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="phoneShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="25"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity=".75"
      />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- Left screen clip -->
    <clipPath id="leftScreenClip">
      <rect
        x="0"
        y="0"
        width="430"
        height="690"
        rx="58"
      />
    </clipPath>

    <!-- Right screen clip -->
    <clipPath id="rightScreenClip">
      <rect
        x="0"
        y="0"
        width="430"
        height="690"
        rx="58"
      />
    </clipPath>

  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect width="1408" height="768" fill="url(#bgGlow)"/>

  <!-- subtle center glow -->
  <ellipse
    cx="704"
    cy="420"
    rx="570"
    ry="270"
    fill="url(#phoneGlow)"
    opacity=".55"
  />

  <!-- stars / particles -->
  <g fill="#B8B8B8">
    <circle cx="126" cy="158" r="1.2"/>
    <circle cx="164" cy="128" r=".8"/>
    <circle cx="245" cy="97" r=".7"/>
    <circle cx="1280" cy="79" r="1"/>
    <circle cx="1235" cy="155" r=".8"/>
    <circle cx="1318" cy="196" r=".6"/>
    <circle cx="91" cy="330" r=".6"/>
    <circle cx="1345" cy="320" r=".7"/>
    <circle cx="112" cy="604" r=".8"/>
    <circle cx="1288" cy="600" r=".8"/>
  </g>


  <!-- ========================================================= -->
  <!-- TITLE -->
  <!-- ========================================================= -->

  <g>
    <line
      x1="436"
      y1="80"
      x2="496"
      y2="80"
      stroke="#8E7847"
      stroke-width="1"
    />

    <line
      x1="912"
      y1="80"
      x2="972"
      y2="80"
      stroke="#8E7847"
      stroke-width="1"
    />

    <!-- left diamond -->
    <path
      d="M496 80 L501 75 L506 80 L501 85 Z"
      fill="#C5A45F"
    />

    <!-- right diamond -->
    <path
      d="M907 80 L912 75 L917 80 L912 85 Z"
      fill="#C5A45F"
    />

    <text
      x="704"
      y="99"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="52"
      letter-spacing="2"
      fill="#F2EEDF"
    >
      TP E-STORE
    </text>
  </g>


  <!-- ========================================================= -->
