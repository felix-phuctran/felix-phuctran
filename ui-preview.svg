      </text>

      <text
        x="227"
        y="635"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        fill="#111"
      >
        €290
      </text>

    </g>

    <!-- Dynamic island -->
    <rect
      x="153"
      y="16"
      width="124"
      height="30"
      rx="16"
      fill="#050505"
    />

    <circle cx="248" cy="31" r="5" fill="#151515"/>

  </g>


  <!-- ========================================================= -->
