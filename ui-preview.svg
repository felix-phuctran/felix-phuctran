  <!-- ========================================================= -->

  <ellipse
    cx="704"
    cy="695"
    rx="500"
    ry="48"
    fill="#000"
    opacity=".8"
    filter="url(#shadow)"
  />

  <!-- ========================================================= -->
  <!-- LEFT PHONE -->
  <!-- ========================================================= -->

