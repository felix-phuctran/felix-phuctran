    <!-- side buttons -->
    <rect x="431" y="150" width="7" height="62" rx="3" fill="#555"/>
    <rect x="431" y="225" width="7" height="35" rx="3" fill="#555"/>
    <rect x="-8" y="180" width="7" height="80" rx="3" fill="#333"/>


    <!-- SCREEN -->
    <g clip-path="url(#rightScreenClip)">

      <rect width="430" height="690" fill="url(#screen)"/>

      <!-- header -->
      <rect width="430" height="90" fill="#F7F1E5"/>

      <!-- menu -->
      <g stroke="#111" stroke-width="2">
        <line x1="25" y1="38" x2="46" y2="38"/>
        <line x1="25" y1="45" x2="46" y2="45"/>
