      />

      <ellipse
        cx="314"
        cy="490"
        rx="56"
        ry="42"
        fill="none"
        stroke="#B99755"
        stroke-width="5"
      />

      <circle
        cx="314"
        cy="532"
        r="10"
        fill="#C9A55F"
      />

      <text
        x="227"
        y="615"
        font-family="Arial, sans-serif"
