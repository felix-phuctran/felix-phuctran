name: Generate Contribution Snake

on:
  schedule:
    # Runs automatically every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generates the snake animations from github contribution graph
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#00ff9d&color_dots=#090e1c,#032c25,#065f46,#10b981,#00ff9d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f3ff&color_dots=#090e1c,#062b47,#0284c7,#38bdf8,#00f3ff

      # Pushes the generated SVGs to the "output" branch
      - name: push github-contribution-grid-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}